<div class="mx-auto max-w-md text-center">

    <div class="text-2xl font-semibold text-white">PLACE ORDER - STEP 2</div>
    <div class="mb-4 text-emerald-100/60">Enter your payment details</div>

    <div class="rounded-xl border border-emerald-800/40 bg-emerald-950/60 p-4 text-emerald-100">
        Card Type:
        <select id="tipo_tarjeta" class="w-full rounded border border-emerald-700 bg-emerald-950 px-3 py-1 text-emerald-50 focus:outline-none">
            <option value="0">Select type</option>
            <option value="visa">Visa</option>
            <option value="master_card">Master Card</option>
        </select><br><br>

        Card Number: <input type="text" id="numero_tarjeta" class="w-full rounded border border-emerald-700 bg-emerald-950 px-3 py-1 text-emerald-50 focus:outline-none"><br><br>
        Cardholder Name: <input type="text" id="titular_tarjeta" class="w-full rounded border border-emerald-700 bg-emerald-950 px-3 py-1 text-emerald-50 focus:outline-none"><br><br>
        Expiration Date: <input type="text" id="fechaCaducidad" class="w-full rounded border border-emerald-700 bg-emerald-950 px-3 py-1 text-emerald-50 focus:outline-none"><br><br>
        CVV: <input type="text" id="cvv" class="w-full rounded border border-emerald-700 bg-emerald-950 px-3 py-1 text-emerald-50 focus:outline-none"><br><br>

        <button id="aceptar_paso_2" class="w-full rounded-full bg-emerald-500 py-2 font-semibold text-emerald-950 hover:bg-emerald-400">CONFIRM</button>
    </div>

</div>
