  <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">

    {{#.}}

    <div class="flex flex-col gap-2 rounded-2xl border border-emerald-800/40 bg-emerald-950/60 p-6">

      <div class="text-lg font-semibold text-emerald-50">{{MARCA}}

  <div class="mt-6 text-center">
