{{#.}}
<div      class="transition hover:scale-110 inline-block align-top w-96 max-w-full h-[40rem] overflow-hidden m-5 rounded-2xl border border-emerald-800/40 bg-emerald-900/20 px-4 py-3 leading-8 text-emerald-100/80 shadow-xl shadow-black/30 transition hover:border-emerald-600/60 hover:bg-emerald-900/30 [&_span]:font-semibold [&_span]:text-emerald-50 [&_br]:leading-none [&_img]:block [&_img]:h-60 [&_img]:w-full [&_img]:rounded-xl [&_img]:object-cover">


    {{marca}}
    {{modelo}} <br>
    <img class="imagen-producto pt-2" src="mostrar_imagen?id={{id}}"/>
    Matrícula: {{matricula}} <br>
    Tipo: {{tipo}} <br>
    Kilometros: {{kilometros}} <br>
    Año: {{año}} <br>
    Caballos: {{cv}} <br>
    De serie:
    {{#stock}}✔️{{/stock}}
    {{^stock}}❌{{/stock}} <br>
    Precio: {{precio}}€<br>
    <a href="#" class="underline" onclick="mostrar_detalles({{id}})">Ver detalles</a><br>
    Cantidad: <input type="number" value="1" class="w-15 rounded-lg border border-emerald-800/60 bg-emerald-950/60 px-3 text-center font-semibold text-emerald-50 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30"><br>
    <a href="#" class="underline" onclick="alert('agregar cantidad a carrito')">Agregar al carrito</a>
</div>
{{/.}}
