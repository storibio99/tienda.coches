<div class="max-w-md mx-auto p-6">

    <p class="mb-4 text-2xl">ログイン情報を入力してください</p>

    <form id="form_login" class="space-y-3">

        <label for="email" class="block">メールアドレス:</label>
        <input type="email" name="email" id="email" value="sergio@gmail.com" class="w-full border border-emerald-300 rounded p-2">

        <label for="pass" class="block">パスワード:</label>
        <input type="password" name="pass" id="pass" value="12345" class="w-full border border-emerald-300 rounded p-2">

        <label class="block">
            <input type="checkbox" id="recordar_pass"> ログイン情報を保存する (準備中...)
        </label>

        <input type="submit" value="ログイン" class="w-full p-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded cursor-pointer">

    </form>

</div>
