<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>  <!--esto es para que funcione en local tambien -->

</head>
<body class="min-h-screen bg-gradient-to-b from-emerald-950 via-emerald-950 to-teal-950 text-emerald-50 antialiased">

<!--asi se importa un fragmento con thymelief-->
<div th:insert="fragments/general.html :: menu"></div>

<div class="px-6 pt-8 pb-4 text-center text-3xl font-semibold tracking-tight">Listar categorias, permitiendo borrar y editar</div>

<div class="px-6 pb-6 text-center">
    <a href="registrarCategoria" class="inline-block rounded-full bg-emerald-500 px-5 py-2 text-sm font-semibold tracking-wide text-emerald-950 shadow-lg shadow-emerald-500/20 transition hover:bg-emerald-400">Nueva Categoria</a>
</div>




<!--LISTADO-->

<div class="mx-auto flex max-w-[106rem] flex-wrap justify-center">

    <div th:each="c : ${categorias}" style="margin: 20px"
         class="inline-block align-top w-96 max-w-full overflow-hidden m-5 rounded-2xl border border-emerald-800/40 bg-emerald-900/20 px-4 py-3 leading-8 text-emerald-100/80 shadow-xl shadow-black/30 transition hover:border-emerald-600/60 hover:bg-emerald-900/30 [&_span]:font-semibold [&_span]:text-emerald-50 [&_br]:leading-none [&_img]:block [&_img]:rounded-xl">

        Nombre: <span th:text="${c.nombre}"></span>
        <br>

        Descripcion: <span th:text="${c.descripcion}"></span>
        <br>

        <!--    asi se llama al controldor de la imagen-->
        <div class="mt-2 h-60 w-full max-w-sm rounded-xl border border-emerald-800/50 bg-emerald-950/40 shadow-lg shadow-black/30 flex items-center justify-center p-3">
            <img th:src="@{${ '../mostrar_imagen_categoria?id=' + c.id }}"
                 class="max-h-full max-w-full object-contain"/>
        </div>

        <br>

        <a th:href="@{${ 'borrarCategoria?id=' + c.id }}" onclick="return confirm('¿Estás seguro?')" class="underline">BORRAR</a>
        <br>

        <a th:href="@{${ 'editarCategoria?id=' + c.id }}" class="underline">EDITAR</a>


    </div>

</div>

<!--FIN LISTADO-->


</body>
</html>
